<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>TheCore — Silicon Core: Neon Spectrum</title>
  <defs>
    <!-- Center Chip: Deep Midnight Indigo Glass -->
    <linearGradient id="c3Chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <!-- Top-Left: CPU (Golden Sunfire) -->
    <linearGradient id="c3TopLeft" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <!-- Top-Right: GPU (Mint to Emerald) -->
    <linearGradient id="c3TopRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <!-- Bottom-Right: Storage (Aqua Cyan) -->
    <linearGradient id="c3BottomRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <!-- Bottom-Left: RAM (Lavender to Violet) -->
    <linearGradient id="c3BottomLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="c3CorePip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="none" />

  <!-- Top-Left Wing: CPU (Amber) -->
  <path d="M 76 228 C 84 144 144 84 228 76 L 228 140 C 180 146 146 180 140 228 Z" fill="url(#c3TopLeft)" />

  <!-- Top-Right Wing: GPU (Emerald) -->
  <path d="M 284 76 C 368 84 428 144 436 228 L 372 228 C 366 180 332 146 284 140 Z" fill="url(#c3TopRight)" />

  <!-- Bottom-Right Wing: Storage (Cyan) -->
  <path d="M 436 284 C 428 368 368 428 284 436 L 284 372 C 332 366 366 332 372 284 Z" fill="url(#c3BottomRight)" />

  <!-- Bottom-Left Wing: RAM (Violet) -->
  <path d="M 228 436 C 144 428 84 368 76 284 L 140 284 C 146 332 180 366 228 372 Z" fill="url(#c3BottomLeft)" />

  <!-- Center Silicon Processor Hub -->
  <rect x="196" y="196" width="120" height="120" rx="28" fill="url(#c3Chip)" />
  <circle cx="256" cy="256" r="26" fill="url(#c3CorePip)" />
</svg>